# Advisor experiment overlay for the existing StreamBed compose stack.
#
# Layered usage (from project root):
#   docker compose -f docker-compose.yml \
#                  -f experiments/advisor/docker-compose.advisor.yml up -d
#
# What this overlay does:
#  1. Flips daemon-edge1 / daemon-server1 to STREAM_TRANSPORT=quic so the
#     daemons spawn QUIC sidecars (single UDP port per side for app↔sidecar).
#  2. Exposes daemon-edge1's inference container TCP port (9100) on the host
#     so frame_gen.py running on the host can reach the advisor edge.
#  3. Declares two `build`-only services so `docker compose build advisor-edge
#     advisor-server` produces the inference images. The services have a
#     `manual` profile so they are NOT started by `docker compose up`; the
#     daemons launch them via /deploy after image push.
#
# Workflow:
#   docker compose -f docker-compose.yml \
#                  -f experiments/advisor/docker-compose.advisor.yml \
#                  build advisor-edge advisor-server
#   docker push ashishbasetty/streambed-advisor-edge:latest
#   docker push ashishbasetty/streambed-advisor-server:latest
#   docker compose -f docker-compose.yml \
#                  -f experiments/advisor/docker-compose.advisor.yml up -d \
#                  controller router daemon-edge1 daemon-server1
#   bash experiments/advisor/scripts/deploy_advisor.sh
#   conda activate streambed && \
#     python -m experiments.advisor.host.frame_gen \
#       --episodes 30 --edge-host 127.0.0.1 --edge-port 9100

version: "3.9"

services:
  daemon-edge1:
    environment:
      - STREAM_TRANSPORT=quic
    # NOTE: do NOT publish 9100 here. The inference container is launched by
    # /deploy with its own port binding (host_port=9100, container_port=9100);
    # publishing on the daemon would collide on host:9100.

  daemon-server1:
    environment:
      - STREAM_TRANSPORT=quic

  # Build-only service for the advisor edge inference image. Not started by
  # `up`; runs only when explicitly invoked (e.g. `docker compose build
  # advisor-edge`). Daemons launch the actual container via /deploy.
  advisor-edge:
    profiles: ["manual"]
    image: ashishbasetty/streambed-advisor-edge:latest
    build:
      # Resolved relative to the project directory (where the base compose
      # lives), not this overlay file — that's docker compose v2 behavior.
      context: .
      dockerfile: experiments/advisor/edge/Dockerfile

  advisor-server:
    profiles: ["manual"]
    image: ashishbasetty/streambed-advisor-server:latest
    build:
      # Resolved relative to the project directory (where the base compose
      # lives), not this overlay file — that's docker compose v2 behavior.
      context: .
      dockerfile: experiments/advisor/server/Dockerfile
