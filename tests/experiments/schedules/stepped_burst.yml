# Canonical proxy schedule: stepped tiers with a mid-run loss/latency burst.
# Picks segments wide enough that 1 Hz metric polling can see the regime
# clearly. Tiers chosen to bracket the CHNK/EMBD crossover at ~80 kbps.
- {at_s: 0,   bps: 500000, loss_pct: 0.00, extra_latency_ms: 0}
- {at_s: 30,  bps: 100000, loss_pct: 0.00, extra_latency_ms: 0}
- {at_s: 60,  bps: 50000,  loss_pct: 0.02, extra_latency_ms: 80}
- {at_s: 90,  bps: 25000,  loss_pct: 0.00, extra_latency_ms: 0}
